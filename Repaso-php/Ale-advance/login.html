<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Fundacion de Proteccion animales Somos Angeles</title>
    <link rel="shortcut icon" href="Imagenes/Puppy.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/inicio.css">
</head>

<body>
    <div class="container">
        <div class="form-box login">
            <form action="">
                <h1>Login</h1><br>
                <p>Bienvenido otra vez</p>
                <hr>
                <div class="input-box">
                    <div>
                        <input type="text" placeholder="correo" id="idusuario">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Ingrese contraseña" id="contraUsario">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn">Iniciar sesion</button>
                <div class="ingresar">
                    <a href="Index.html">No se ha reguistrado: reguistrese</a>
                </div>
            </form>
        </div>
    </div>
    <script>
document.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const correo = document.getElementById("idusuario").value;
    const password = document.getElementById("contraUsario").value;

    const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ correo, password })
    });

    const data = await res.json();

    localStorage.setItem("rol", data.rol);

    if (data.rol === "admin") {
        window.location.href = "Adopciones.html";
    } else {
        window.location.href = "inicio.html";
    }
});
</script>
</body>

</html>
